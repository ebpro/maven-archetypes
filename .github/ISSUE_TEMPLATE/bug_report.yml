name: Bug report
description: Report a defect or unexpected behavior
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting. Fill in every section you can."
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. mvn archetype:generate -DarchetypeGroupId=fr.ebruno.maven.archetypes -DarchetypeArtifactId=...
        2. cd generated-project && mvn verify
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "archetype version (e.g. 1.2.3)"
    validations:
      required: true
  - type: input
    id: archetype
    attributes:
      label: Archetype
      description: "Which archetype (simple, withparent, etc.)"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      render: shell
