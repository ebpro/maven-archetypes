name: CI Java (Host)

on:
  push:
    branches:
      - "**"
    tags:
      - "!**"
  workflow_dispatch:

env:
  NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
  NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
  MAVEN_PROXY_URL: ${{ secrets.MAVEN_PROXY_URL }}
  GITHUBORG: ${{ secrets.GITHUBORG }}
  GITHUBACTOR: ${{ secrets.GITHUBORG }}
  GITHUBTOKEN: ${{ secrets.GITHUBTOKEN }}

permissions:
  contents: read

jobs:
    build:
        name: build-test-deploy
        uses: ebpro/gh-actions-shared-java/.github/workflows/ci-shareable-maven.yml@develop
        secrets: inherit
        with:
          runs-on: ebpro-org
          jdk-matrix: '[ "25" ]'
          maven-matrix: '[ "3.9.11" ]'
          verify-goal: 'install'
          quality-goal-run: "false"
          deploy-goal-run: "true"
          deploy-goal-develop: ''
          deploy-goal-release: ''
          site-goal-run: "true"
          site-goal-branch: "master"

    docker-build:
        name: docker-build
        needs: build
        runs-on: ebpro-org
        strategy:
          fail-fast: false
          matrix:
            include:
              - archetype: maven-archetype-simple
                target: finallibs
                extra-args: "--build-arg APP_MAIN_CLASS=it.pkg.App"
              - archetype: maven-archetype-simple
                target: finaljlink
                extra-args: ""
              - archetype: maven-archetype-withparent
                target: finallibs
                extra-args: "--build-arg APP_MAIN_CLASS=it.pkg.App"
              - archetype: maven-archetype-withparent
                target: finaljlink
                extra-args: ""
        steps:
          - uses: actions/checkout@v7
            with:
              submodules: true
              fetch-depth: 0

          - name: Set up JDK 25
            uses: actions/setup-java@v6
            with:
              distribution: temurin
              java-version: '25'

          - name: Install archetype locally
            run: |
              ./mvnw -B -s ci-utils-java/ci-settings.xml \
                -pl ${{ matrix.archetype }} -am install -DskipTests

          - name: Generate test project
            run: |
              # Run from a clean temp dir: invoking archetype:generate from the
              # repo root makes the archetype plugin inject the multi-module
              # parent (fr.ebruno.maven.archetypes:maven-archetypes) into the
              # generated project, which is then unresolvable at docker build time.
              mkdir -p /tmp/gen && cd /tmp/gen
              GROUP="it.docker"
              PKG="it.docker"
              if [ "${{ matrix.archetype }}" = "maven-archetype-simple" ]; then
                "$GITHUB_WORKSPACE/mvnw" -B --settings "$GITHUB_WORKSPACE/ci-utils-java/ci-settings.xml" archetype:generate \
                  -DarchetypeGroupId=fr.ebruno.maven.archetypes \
                  -DarchetypeArtifactId=maven-archetype-simple \
                  -DarchetypeVersion=0.1.11-SNAPSHOT \
                  -DgroupId=${GROUP} \
                  -DartifactId=dockertest \
                  -Dversion=1.0.0-SNAPSHOT \
                  -Dpackage=${PKG}
              else
                "$GITHUB_WORKSPACE/mvnw" -B --settings "$GITHUB_WORKSPACE/ci-utils-java/ci-settings.xml" archetype:generate \
                  -DarchetypeGroupId=fr.ebruno.maven.archetypes \
                  -DarchetypeArtifactId=maven-archetype-withparent \
                  -DarchetypeVersion=0.1.11-SNAPSHOT \
                  -DgroupId=${GROUP} \
                  -DartifactId=dockertest \
                  -Dversion=1.0.0-SNAPSHOT \
                  -Dpackage=${PKG} \
                  -DgithubAccount=ebpro
              fi

          - name: Build Docker image
            working-directory: /tmp/gen/dockertest
            run: |
              # Pass the proxy-aware Maven settings into the container so that
              # dependency resolution during the in-container `mvn` build can
              # route through the Nexus proxy/cache. The settings file is
              # base64-encoded and injected as a build-arg (credentials stay in
              # the file; the Dockerfile template decodes it at build time).
              # NOTE: $GITHUB_WORKSPACE is required here because this step's
              # working-directory is the generated project, not the repo root.
              SETTINGS_B64=$(base64 -w0 "$GITHUB_WORKSPACE/ci-utils-java/ci-settings.xml")
              # TODO: Update Dockerfile templates to decode MAVEN_SETTINGS_B64
              #       into /root/.m2/settings.xml (and expose MAVEN_PROXY_URL
              #       as an ENV) so the in-container Maven picks it up.
              docker build \
                -f docker/Dockerfile \
                --target ${{ matrix.target }} \
                --build-arg GITHUBACTOR=${GITHUBACTOR} \
                --build-arg GITHUBTOKEN=${GITHUBTOKEN} \
                --build-arg MAVEN_SETTINGS_B64="${SETTINGS_B64}" \
                ${{ matrix.extra-args }} \
                -t ci-test:${{ matrix.archetype }}-${{ matrix.target }} \
                .

          - name: Verify image exists
            run: |
              docker image inspect "ci-test:${{ matrix.archetype }}-${{ matrix.target }}" > /dev/null && \
                echo "OK: ci-test:${{ matrix.archetype }}-${{ matrix.target }}"
