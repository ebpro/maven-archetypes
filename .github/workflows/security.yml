name: Security

on:
  pull_request:
  merge_group: # run the dependency-review gate in the merge queue
  schedule:
    # Weekly scan (Sundays at 2am UTC)
    - cron: '0 2 * * 0'

permissions:
  contents: read
  security-events: write
  actions: read

# All jobs run on self-hosted runners (ebpro-org) to leverage:
# - Nexus (Maven proxy/cache) — configured via runner env vars / ci-settings.xml
# - Harbor (Docker registry mirror) — configured via runner daemon.json
# This avoids re-downloading artifacts from the internet on every run.
# No arch constraint on the runner label: ARM runners are supported.
env:
  RUNNER: self-hosted

jobs:
  dependency-review:
    name: Dependency Review
    # The dependency-review-action is diff-based: it compares a base ref to a
    # head ref to flag *newly introduced* vulnerable dependencies. GitHub only
    # supplies base/head refs for `pull_request`, `merge_group`, and
    # `pull_request_target` events. On `push`, `schedule`, and
    # `workflow_dispatch` there is no base ref, so the action aborts with:
    #   "Both a base ref and head ref must be provided"
    # Fix: gate this job to the events that actually provide a base/head diff.
    # Full-repo dependency scanning on schedule is covered by the
    # OWASP Dependency Check canary job below.
    if: >-
      github.event_name == 'pull_request'
      || github.event_name == 'merge_group'
    runs-on: ebpro-org
    steps:
      - uses: actions/checkout@v7

      - name: Review dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # BOMs in <dependencyManagement> with <scope>import</scope> are
          # version-management imports, not real dependencies.
          # The action does not flag them, so no ignore list is needed.

  sbom:
    name: Generate SBOM
    runs-on: ebpro-org
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Generate CycloneDX SBOM
        run: ./mvnw -B --settings ci-utils-java/ci-settings.xml cyclonedx:makeBom -DoutputFormat=All -DoutputName=bom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            **/target/bom.json
            **/target/bom.xml

  dependency-check-canary:
    name: OWASP Dependency Check (canary)
    runs-on: ebpro-org
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build parent + canary
        run: ./mvnw -B --settings ci-utils-java/ci-settings.xml clean verify -DskipTests --errors -pl maven-archetype-simple -am
        env:
          MAVEN_OPTS: -Xmx512m

      - name: NVD date
        id: nvd-date
        run: echo "d=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Cache NVD data
        uses: actions/cache@v6
        with:
          path: /home/runner/.nvd-cache
          key: nvd-${{ steps.nvd-date.outputs.d }}
          restore-keys: |
            nvd-

      - name: Run OWASP Dependency Check on canary
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ./mvnw -B org.owasp:dependency-check-maven:13.0.0:check \
            --settings ci-utils-java/ci-settings.xml \
            -pl maven-archetype-simple \
            -DnvdApiKey="${NVD_API_KEY}" \
            -DdataDirectory=/home/runner/.nvd-cache \
            -DautoUpdate=true \
            -DfailBuildOnCVSS=9
